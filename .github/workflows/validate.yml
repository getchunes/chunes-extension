name: Validate extension

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate source
        shell: pwsh
        run: ./scripts/validate.ps1

      - name: Build deterministic upload package
        shell: pwsh
        run: ./scripts/package.ps1

      - name: Inspect upload package
        shell: pwsh
        run: ./scripts/validate-package.ps1
